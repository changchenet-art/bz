<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>경리회계 업무지원실 · 통합 관리 시스템</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1f2a37; --muted:#6b7684;
    --line:#e4e8ee; --line2:#eef1f5;
    --brand:#127a5b; --brand-ink:#0e5c45; --brand-soft:#e7f4ee;
    --blue:#1e6fd9; --blue-soft:#e8f0fc;
    --warn:#c2410c; --warn-soft:#fdecdf;
    --danger:#c0392b; --danger-soft:#fdecea;
    --ok:#127a5b; --ok-soft:#e7f4ee;
    --shadow:0 1px 3px rgba(20,30,45,.06), 0 6px 20px rgba(20,30,45,.05);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:14px}

  /* Layout */
  .app{display:flex; min-height:100vh}
  .side{
    width:224px; flex:0 0 224px; background:#0f2b22; color:#cfe6dc;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{padding:20px 18px 14px; border-bottom:1px solid rgba(255,255,255,.08)}
  .brand h1{font-size:16px; margin:0; color:#fff; letter-spacing:-.3px}
  .brand p{margin:4px 0 0; font-size:11px; color:#8fb9ab}
  .nav{padding:10px 8px; overflow-y:auto; flex:1}
  .nav .grp{font-size:10.5px; color:#6f9587; text-transform:uppercase; letter-spacing:.6px; padding:12px 12px 5px; font-weight:700}
  .nav a{
    display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:8px;
    color:#cfe6dc; text-decoration:none; font-size:13px; margin:1px 0;
  }
  .nav a .ic{width:17px; text-align:center; font-size:14px}
  .nav a:hover{background:rgba(255,255,255,.06)}
  .nav a.active{background:var(--brand); color:#fff; font-weight:600}
  .side .foot{padding:12px; border-top:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:6px}
  .side .foot button{
    background:rgba(255,255,255,.08); color:#dff0e9; border:none; padding:8px; border-radius:7px; font-size:12px;
  }
  .side .foot button:hover{background:rgba(255,255,255,.16)}

  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .topbar{
    background:var(--panel); border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;
  }
  .topbar h2{margin:0; font-size:18px; letter-spacing:-.4px}
  .topbar .sub{font-size:12px; color:var(--muted); margin-top:2px}
  .topbar .right{display:flex; align-items:center; gap:10px}
  .content{padding:22px 24px 60px; max-width:1240px; width:100%}

  /* Buttons */
  .btn{border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 13px; border-radius:8px; font-size:13px; font-weight:600}
  .btn:hover{background:#f7f9fb}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn.primary:hover{background:var(--brand-ink)}
  .btn.sm{padding:5px 9px; font-size:12px; border-radius:6px; font-weight:500}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
  .btn.ghost:hover{background:#eef1f5; color:var(--ink)}
  .btn.danger{color:var(--danger); border-color:#f0cdc8}
  .btn.danger:hover{background:var(--danger-soft)}

  /* Cards */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-bottom:18px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
  .card .k{font-size:12px; color:var(--muted); font-weight:600}
  .card .v{font-size:24px; font-weight:800; letter-spacing:-.5px; margin-top:6px}
  .card .v small{font-size:13px; font-weight:600; color:var(--muted)}
  .card .sub{font-size:11.5px; color:var(--muted); margin-top:4px}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden}
  .panel .ph{padding:13px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between}
  .panel .ph h3{margin:0; font-size:14.5px}
  .panel .ph .tools{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
  .panel .pb{padding:0}
  .panel .pb.pad{padding:16px 18px}

  /* Table */
  .tbl{width:100%; border-collapse:collapse; font-size:13px}
  .tbl th,.tbl td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line2); vertical-align:middle}
  .tbl th{background:#fafbfc; font-size:11.5px; color:var(--muted); font-weight:700; text-transform:none; position:sticky; top:0}
  .tbl tbody tr:hover, .tbl tbody tr:hover{background:#f9fbfc}
  .tbl td.num, .tbl th.num{text-align:right; font-variant-numeric:tabular-nums}
  .tbl .rowbtns{display:flex; gap:5px; justify-content:flex-end}
  .tbl-wrap{overflow-x:auto}
  .empty{padding:40px; text-align:center; color:var(--muted); font-size:13px}
  .empty .big{font-size:30px; margin-bottom:8px; opacity:.5}

  /* Badge */
  .badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700; white-space:nowrap}
  .badge.g{background:var(--ok-soft); color:var(--ok)}
  .badge.b{background:var(--blue-soft); color:var(--blue)}
  .badge.o{background:var(--warn-soft); color:var(--warn)}
  .badge.r{background:var(--danger-soft); color:var(--danger)}
  .badge.n{background:#eef1f5; color:var(--muted)}
  .dday{font-weight:800; font-variant-numeric:tabular-nums}

  /* Filters */
  .filters{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .filters input,.filters select{border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:#fff}
  .filters input[type=search]{min-width:180px}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{border:none; background:#fff; padding:7px 12px; font-size:12.5px; color:var(--muted); border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--brand-soft); color:var(--brand-ink); font-weight:700}

  /* Modal */
  .mask{position:fixed; inset:0; background:rgba(15,25,20,.42); display:none; align-items:flex-start; justify-content:center; z-index:60; padding:40px 16px; overflow-y:auto}
  .mask.on{display:flex}
  .modal{background:#fff; width:100%; max-width:600px; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.25); overflow:hidden}
  .modal.wide{max-width:900px}
  .modal .mh{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between}
  .modal .mh h3{margin:0; font-size:16px}
  .modal .mb{padding:18px 20px; max-height:66vh; overflow-y:auto}
  .modal .mf{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; background:#fafbfc}
  .close{border:none; background:none; font-size:22px; color:var(--muted); line-height:1; padding:0 4px}

  /* Form */
  .frm{display:grid; grid-template-columns:1fr 1fr; gap:13px 16px}
  .frm .fld{display:flex; flex-direction:column; gap:5px}
  .frm .fld.full{grid-column:1 / -1}
  .frm label{font-size:12px; font-weight:700; color:#455161}
  .frm label .req{color:var(--danger)}
  .frm input,.frm select,.frm textarea{
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:#fff; width:100%;
  }
  .frm input:focus,.frm select:focus,.frm textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
  .frm textarea{resize:vertical; min-height:70px}
  .hint{font-size:11px; color:var(--muted)}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:#0f2b22; color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:.25s; z-index:100; pointer-events:none}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  .pill-row{display:flex; gap:6px; flex-wrap:wrap}
  .mini{font-size:11.5px; color:var(--muted)}
  .prog{height:7px; background:#eef1f5; border-radius:5px; overflow:hidden; min-width:70px}
  .prog > i{display:block; height:100%; background:var(--brand)}
  .sec-title{font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:22px 0 8px}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  @media(max-width:1000px){ .two-col{grid-template-columns:1fr} .frm{grid-template-columns:1fr} }
  @media(max-width:760px){ .side{display:none} }

  /* Print document */
  .doc-preview{background:#fff; border:1px solid var(--line); border-radius:10px; padding:34px 40px; font-size:13.5px; color:#111}
  .doc-preview h1{text-align:center; font-size:24px; letter-spacing:14px; margin:0 0 24px; border-bottom:3px double #111; padding-bottom:14px}
  .doc-preview table{width:100%; border-collapse:collapse; margin:10px 0}
  .doc-preview table th,.doc-preview table td{border:1px solid #333; padding:8px 10px}
  .doc-preview table th{background:#f0f0f0; width:110px; text-align:center}
  .doc-preview .right{text-align:right}
  .doc-preview .center{text-align:center}
  .doc-preview .sign{margin-top:36px; text-align:right; line-height:2.2}
  @media print{
    .side,.topbar,.no-print{display:none !important}
    .content{padding:0; max-width:none}
    body{background:#fff}
    .doc-preview{border:none; border-radius:0; padding:0}
    .panel{box-shadow:none; border:none}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side no-print">
    <div class="brand">
      <h1>경리 업무지원실</h1>
      <p>통합 관리 시스템 v1.0</p>
      <div id="syncStatus" onclick="Sync.start()" title="클릭하면 서버 재접속을 시도합니다"
           style="margin-top:8px;font-size:11px;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.08);cursor:pointer;display:inline-block">⚪ 확인 중…</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <button onclick="openPasteImport()">📋 붙여넣기로 가져오기</button>
      <button onclick="loadSeed()">🏢 ㈜창체넷 기초자료</button>
      <button onclick="Backup.export()">⬇ 전체 백업 (JSON)</button>
      <button onclick="Backup.importPrompt()">⬆ 백업 복원</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar no-print">
      <div>
        <h2 id="pageTitle">대시보드</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="right" id="topActions"></div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,.csv" style="display:none" />

<script>
/* ============================================================
   경리회계 업무지원실 통합 관리 시스템 — 단일 파일 웹앱
   데이터는 브라우저 localStorage에 자동 저장됩니다.
   ============================================================ */
"use strict";

/* ---------- 유틸 ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const won = n => (Number(n)||0).toLocaleString('ko-KR');
const todayStr = () => new Date().toISOString().slice(0,10);
function daysBetween(dateStr){ // dateStr - today, in days (음수=지남)
  if(!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00");
  const t = new Date(todayStr()+"T00:00:00");
  return Math.round((d - t)/86400000);
}
function ddayBadge(dateStr){
  const d = daysBetween(dateStr);
  if(d===null) return '<span class="mini">-</span>';
  if(d<0)  return `<span class="badge r dday">D+${-d} 지남</span>`;
  if(d===0)return `<span class="badge r dday">D-DAY</span>`;
  if(d<=7) return `<span class="badge o dday">D-${d}</span>`;
  if(d<=30)return `<span class="badge b dday">D-${d}</span>`;
  return `<span class="badge n dday">D-${d}</span>`;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- 저장소 ---------- */
const DB_KEY = "gyeongri_office_db_v1";
const Store = {
  data:null,
  load(){
    try{ this.data = JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
    catch(e){ this.data = {}; }
    // 컬렉션 초기화
    ["todos","vendors","orders","contacts","docs","contracts","employees","leaves","budgets","txns","payments","costs"].forEach(k=>{ if(!this.data[k]) this.data[k]=[]; });
    if(!this.data._meta) this.data._meta={created:todayStr()};
  },
  saveLocal(){ localStorage.setItem(DB_KEY, JSON.stringify(this.data)); },
  save(){ this.saveLocal(); if(window.Sync) Sync.pushSoon(); },
  list(k){ return this.data[k] || []; },
  get(k,id){ return this.list(k).find(x=>x.id===id); },
  upsert(k,obj){
    if(obj.id){ const i=this.data[k].findIndex(x=>x.id===obj.id); if(i>=0) this.data[k][i]={...this.data[k][i],...obj}; else this.data[k].push(obj); }
    else { obj.id=uid(); obj._c=todayStr(); this.data[k].push(obj); }
    this.save(); return obj;
  },
  remove(k,id){ this.data[k]=this.list(k).filter(x=>x.id!==id); this.save(); }
};

/* ---------- 옵션 ---------- */

  evidence:["세금계산서","계산서","카드전표","현금영수증","간이영수증","이체증","없음"],
  account:["매출","용역수입","급여","4대보험","임차료","수도광열비","통신비","소모품비","지급수수료","교육훈련비","여비교통비","접대비","광고선전비","세금과공과","외주비","강사료","자문료","기타"],
  // ㈜창체넷 금전출납 계정과목 체계
  ledgerAccount:["111. 학교","112.정부.지자체,교육청","113.기관","114.기업","115. 기타","121. 교구 (완제품)","122. 교재 (출판인쇄)","123. 재료 (커피점토외)","124. 기타","131. 개발 지원금","132. 인건비 (사회적기업) 보조금","133. 위탁운영 보조금","134. 기타","141. SW개발 제작","142. 디자인,외 지식 콘텐츠 제작","143. 학술 연구개발","211. 경영 마케팅 자문비","212. 전문자문비","213.  강사비","221. 위탁 기술개발비","222. 시제품, 견본 제작비","223. 원재료구입비","224. 역량강화비","225. 연구활동비","226. 연구원 인건비","227. 임차비","228.기술자문비","229. IP확보","231. 식비,간식비","232. 의복비","233. 여가 및 의료비","241. 광고 출력비","242. 홍보 마케팅 관리비","243. 홍보물 구입","251. 도서 인쇄비","252. 비품구입","253. 교육훈련비","254. 소모품비","255. 접대비","256. 여비 및 교통비","257. 운반, 포장비","258. 임차경비","259. 재료비","260. 소프트웨어 구입 및 임차","261. 회의비","262. 위탁의뢰비","271. 차량 유지비","272. 차량 구입, 임차","311. 급여","312. 퇴직 적립금","313. 사회보험부담금","314. 일용근로비","315. 제수당","316. 상여금","321. 임차료","322. 수도광열비","323.  수선비","324. 통신비","325. 기타","411. 이자수입","412. 잡이익","413. 이월금","414. 기타  수익","511. 지급수수료","512. 기부금","513. 잡손실","514. 지급이자","516. 감가상각비","517. 기타 지출","611. 법인세 및 지방세","612. 보험료","613. 공공요금","721. 선입금","722. 가지급금","723. 대출금","731. 차입금 (대차용금)","732. 차출금 (대차용금)","741. 예정수익","742. 예정지출","743. 보통예금","744. 가수금"],
  incomeType:["기타소득(8.8%)","사업소득(3.3%)"],
  costCategory:["교구","교재","재료","인쇄","장비","외주","자문","운송","기타"]
};

/* ---------- ㈜창체넷 기초자료 (잔고·주민번호·급여 등 민감정보 제외) ---------- */

function applySeed(){
  Store.data._seed={accounts:SEED.accounts, projects:SEED.projects};
  const has=(k,fn)=>Store.list(k).some(fn);
  SEED.employees.forEach(e=>{ if(!has("employees",x=>x.name===e.name)) Store.upsert("employees",{...e}); });
  SEED.projects.forEach(p=>{ if(!has("budgets",b=>b.project===p)) Store.upsert("budgets",{project:p,item:"",amount:0,year:2026}); });
  SEED.vendors.forEach(v=>{ if(!has("vendors",x=>x.name===v.name)) Store.upsert("vendors",{...v}); });
  SEED.contracts.forEach(c=>{ if(!has("contracts",x=>x.name===c.name)) Store.upsert("contracts",{started:"해당없음",...c}); });
  SEED.orders.forEach(o=>{ if(!has("orders",x=>x.item===o.item&&x.vendor===o.vendor)) Store.upsert("orders",{...o}); });
  SEED.costs.forEach(c=>{ if(!has("costs",x=>x.item===c.item)) Store.upsert("costs",{...c}); });
  Store.save();
}
function loadSeed(){
  if(!confirm("㈜창체넷 기초자료(계좌·사업명·직원·거래처·2024 계약 26건·이화여대 견적·원가)를 불러옵니다.\n※ 잔고·주민번호·급여 등 민감정보는 포함되지 않습니다.\n이미 있는 항목은 건너뜁니다. 계속할까요?")) return;
  applySeed();
  toast("기초자료를 불러왔습니다"); Router.go(Router.current);
}
function seededProjects(){ // 사업명 후보: 시드 + 예산 + 거래 + 지급
  const s=new Set((Store.data._seed&&Store.data._seed.projects)||[]);
  Store.list("budgets").forEach(b=>b.project&&s.add(b.project));
  Store.list("txns").forEach(t=>t.project&&s.add(t.project));
  return [...s];
}
function seededAccounts(){ return (Store.data._seed&&Store.data._seed.accounts)||[]; }

/* ---------- 제네릭 목록/폼 ---------- */
let genState={};
function renderGeneric(key){
  const s=SCHEMA[key];
  setHeader(s.title, s.sub,
    `<button class="btn" onclick="exportCSV('${key}')">엑셀(CSV) 내보내기</button>
     <button class="btn primary" onclick="openForm('${key}')">+ 새로 추가</button>`);
  genState[key]=genState[key]||{q:""};
  const view=$('#view');
  view.innerHTML=`
    <div class="panel">
      <div class="ph">
        <div class="filters">
          <input type="search" id="q_${key}" placeholder="검색…" value="${esc(genState[key].q)}" />
        </div>
        <div class="tools mini" id="count_${key}"></div>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        ${s.cols.map(c=>`<th class="${isNumCol(s,c)?'num':''}">${esc(s.colLabels[c]||c)}</th>`).join('')}
        <th style="width:96px"></th>
      </tr></thead><tbody id="rows_${key}"></tbody></table></div>
    </div>`;
  $(`#q_${key}`).addEventListener('input',e=>{genState[key].q=e.target.value; drawRows(key);});
  drawRows(key);
}
function isNumCol(s,c){ return s.render&&s.render[c]&&/num/.test((s.render[c](0,{})||'')); }
function drawRows(key){
  const s=SCHEMA[key]; let rows=Store.list(key).slice();
  const q=(genState[key].q||"").toLowerCase().trim();
  if(q) rows=rows.filter(r=>(s.search||s.cols).some(f=>String(r[f]??"").toLowerCase().includes(q)));
  if(s.sort) rows.sort(s.sort);
  $(`#count_${key}`).textContent=`${rows.length}건`;
  const tb=$(`#rows_${key}`);
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="${s.cols.length+1}"><div class="empty"><div class="big">${s.icon}</div>등록된 항목이 없습니다. ‘새로 추가’를 눌러 시작하세요.</div></td></tr>`; return; }
  tb.innerHTML=rows.map(r=>{
    const tds=s.cols.map(c=>{
      let val = s.render&&s.render[c] ? s.render[c](r[c],r) : esc(r[c]??"");
      const numc = (''+val).includes('class="num"')||isNumCol(s,c);
      return `<td class="${numc?'num':''}">${val||'<span class="mini">-</span>'}</td>`;
    }).join('');
    return `<tr>${tds}<td><div class="rowbtns">
      <button class="btn sm ghost" onclick="openForm('${key}','${r.id}')">수정</button>
      <button class="btn sm ghost" onclick="delItem('${key}','${r.id}')">🗑</button>
    </div></td></tr>`;
  }).join('');
}

function fieldInput(f,val){
  const v = val ?? (f.def? (typeof f.def==='function'?f.def():f.def) : "");
  const req = f.req?'<span class="req">*</span>':'';
  let input;
  if(f.type==="select"){
    input=`<select name="${f.k}">${(f.opt||[]).map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  } else if(f.type==="textarea"){
    input=`<textarea name="${f.k}">${esc(v)}</textarea>`;
  } else if(f.type==="vendor"){
    const opts=Store.list("vendors").map(x=>`<option ${x.name==v?'selected':''}>${esc(x.name)}</option>`).join('');
    input=`<input name="${f.k}" list="dl_vendors" value="${esc(v)}" placeholder="거래처명"><datalist id="dl_vendors"><option value=""></option>${opts}</datalist>`;
  } else if(f.type==="employee"){
    const opts=Store.list("employees").map(x=>`<option ${x.name==v?'selected':''}>${esc(x.name)}</option>`).join('');
    input=`<select name="${f.k}"><option value="">선택</option>${opts}</select>`;
  } else {
    const t=f.type==="number"?"number":f.type==="date"?"date":"text";
    input=`<input type="${t}" name="${f.k}" value="${esc(v)}" ${f.type==='number'?'step="1"':''}>`;
  }
  return `<div class="fld ${f.full?'full':''}"><label>${esc(f.label)} ${req}</label>${input}</div>`;
}

function openForm(key,id){
  const s=SCHEMA[key]; const item=id?Store.get(key,id):{};
  openModal((id?"수정":"추가")+" · "+s.title,
    `<form id="genForm" class="frm">${s.fields.map(f=>fieldInput(f,item[f.k])).join('')}</form>`,
    `<button class="btn" onclick="closeModal()">취소</button>
     <button class="btn primary" onclick="saveGen('${key}','${id||''}')">저장</button>`);
}
function saveGen(key,id){
  const s=SCHEMA[key]; const fd=new FormData($('#genForm')); const obj=id?{id}:{};
  for(const f of s.fields){ obj[f.k]=fd.get(f.k); }
  for(const f of s.fields){ if(f.req && !String(obj[f.k]||"").trim()){ toast(f.label+"은(는) 필수입니다"); return; } }
  Store.upsert(key,obj); closeModal(); toast("저장되었습니다"); drawRows(key);
  // 명부 잔여연차 등 갱신 위해 관련 화면이면 재렌더
  if(key==="leaves") { /* employees 화면 영향 */ }
}
function delItem(key,id){
  const s=SCHEMA[key]; const it=Store.get(key,id);
  if(!confirm(`삭제하시겠습니까?\n\n${(it&&(it.name||it.item||it.emp||it.desc))||''}`)) return;
  Store.remove(key,id); toast("삭제되었습니다"); drawRows(key);
}

function renderTodos(){
  setHeader("할 일 · 업무진도","매일 업무 체크 및 진행 현황",
    `<button class="btn primary" onclick="openTodo()">+ 할 일 추가</button>`);
  genState.todos=genState.todos||{f:"all"};
  $('#view').innerHTML=`
    <div class="panel"><div class="ph">
      <div class="seg" id="todoSeg">
        ${[["all","전체"],["today","오늘"],["week","이번주"],["late","지연"],["done","완료"]].map(([k,l])=>
          `<button data-f="${k}" class="${genState.todos.f===k?'on':''}">${l}</button>`).join('')}
      </div>
      <div class="mini" id="todoCount"></div>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th style="width:34px"></th><th>업무</th><th>담당</th><th>마감</th><th>남은</th>
      <th>우선</th><th style="width:130px">진도</th><th>상태</th><th style="width:96px"></th>
    </tr></thead><tbody id="todoRows"></tbody></table></div></div>`;
  $$('#todoSeg button').forEach(b=>b.onclick=()=>{genState.todos.f=b.dataset.f; renderTodos();});
  drawTodos();
}
function drawTodos(){
  let rows=Store.list("todos").slice();
  const f=genState.todos.f;
  rows.sort((a,b)=>{
    if((a.status==="완료")!==(b.status==="완료")) return a.status==="완료"?1:-1;
    return (a.due||"9").localeCompare(b.due||"9");
  });
  if(f==="today") rows=rows.filter(r=>r.due===todayStr()&&r.status!=="완료");
  else if(f==="week"){ rows=rows.filter(r=>{const d=daysBetween(r.due); return d!==null&&d>=0&&d<=7&&r.status!=="완료";}); }
  else if(f==="late") rows=rows.filter(r=>{const d=daysBetween(r.due); return d!==null&&d<0&&r.status!=="완료";});
  else if(f==="done") rows=rows.filter(r=>r.status==="완료");
  else rows=rows.filter(r=>r.status!=="완료" || true);
  $('#todoCount').textContent=`${rows.length}건`;
  const tb=$('#todoRows');
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="9"><div class="empty"><div class="big">✅</div>표시할 할 일이 없습니다.</div></td></tr>`; return; }
  tb.innerHTML=rows.map(r=>{
    const done=r.status==="완료";
    const prog=Number(r.progress)||0;
    return `<tr style="${done?'opacity:.55':''}">
      <td><input type="checkbox" ${done?'checked':''} onchange="toggleTodo('${r.id}')"></td>
      <td><b style="${done?'text-decoration:line-through':''}">${esc(r.title)}</b>${r.memo?`<div class="mini">${esc(r.memo)}</div>`:''}</td>
      <td>${esc(r.owner)||'<span class="mini">-</span>'}</td>
      <td>${esc(r.due)||'<span class="mini">-</span>'}</td>
      <td>${r.due?ddayBadge(r.due):'<span class="mini">-</span>'}</td>
      <td>${badgeFor(r.priority||"보통",{"높음":"r","보통":"b","낮음":"n"})}</td>
      <td><div style="display:flex;align-items:center;gap:7px"><div class="prog"><i style="width:${prog}%"></i></div><span class="mini">${prog}%</span></div></td>
      <td>${badgeFor(r.status||"대기",{"완료":"g","진행중":"o","보류":"n","대기":"b"})}</td>
      <td><div class="rowbtns">
        <button class="btn sm ghost" onclick="openTodo('${r.id}')">수정</button>
        <button class="btn sm ghost" onclick="delTodo('${r.id}')">🗑</button>
      </div></td></tr>`;
  }).join('');
}
function toggleTodo(id){ const t=Store.get("todos",id); const done=t.status==="완료"; Store.upsert("todos",{id,status:done?"진행중":"완료",progress:done?(t.progress||50):100}); drawTodos(); renderMaybeDash(); }
function delTodo(id){ if(!confirm("삭제하시겠습니까?")) return; Store.remove("todos",id); drawTodos(); }
function openTodo(id){
  const t=id?Store.get("todos",id):{};
  openModal((id?"수정":"추가")+" · 할 일",`<form id="todoForm" class="frm">
    <div class="fld full"><label>업무명 <span class="req">*</span></label><input name="title" value="${esc(t.title||'')}"></div>
    <div class="fld"><label>담당</label><input name="owner" value="${esc(t.owner||'')}"></div>
    <div class="fld"><label>마감일</label><input type="date" name="due" value="${esc(t.due||'')}"></div>
    <div class="fld"><label>우선순위</label><select name="priority">${OPT.priority.map(o=>`<option ${o===(t.priority||'보통')?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="fld"><label>상태</label><select name="status">${OPT.todoStatus.map(o=>`<option ${o===(t.status||'대기')?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="fld"><label>진도(%)</label><input type="number" name="progress" min="0" max="100" value="${t.progress??0}"></div>
    <div class="fld"><label>분류</label><input name="cat" value="${esc(t.cat||'')}" placeholder="예: 회계, 계약, 총무"></div>
    <div class="fld full"><label>메모</label><textarea name="memo">${esc(t.memo||'')}</textarea></div>
  </form>`,
  `<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveTodo('${id||''}')">저장</button>`);
}
function saveTodo(id){
  const fd=new FormData($('#todoForm')); const o=id?{id}:{};
  ["title","owner","due","priority","status","progress","cat","memo"].forEach(k=>o[k]=fd.get(k));
  if(!o.title.trim()){ toast("업무명은 필수입니다"); return; }
  if(o.status==="완료"&&(!o.progress||o.progress<100)) o.progress=100;
  Store.upsert("todos",o); closeModal(); toast("저장되었습니다"); drawTodos();
}
function renderMaybeDash(){ if(Router.current==="dashboard") renderDashboard(); }

function txnFiltered(){
  let rows=Store.list("txns").slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const st=genState.txns;
  if(st.month) rows=rows.filter(r=>(r.date||"").startsWith(st.month));
  if(st.type) rows=rows.filter(r=>r.type===st.type);
  if(st.q){ const q=st.q.toLowerCase(); rows=rows.filter(r=>[r.desc,r.vendor,r.account].some(v=>String(v||"").toLowerCase().includes(q))); }
  return rows;
}
function drawTxns(){
  const rows=txnFiltered();
  const inc=rows.filter(r=>r.type==="수입").reduce((s,r)=>s+txnTotal(r),0);
  const exp=rows.filter(r=>r.type==="지출").reduce((s,r)=>s+txnTotal(r),0);
  const vat=rows.reduce((s,r)=>s+(Number(r.vat)||0),0);
  $('#txnCards').innerHTML=`
    ${card("이번달 수입",won(inc)+"<small> 원</small>","g")}
    ${card("이번달 지출",won(exp)+"<small> 원</small>","r")}
    ${card("수지 차액",won(inc-exp)+"<small> 원</small>",inc-exp>=0?"b":"o")}
    ${card("부가세 합계",won(vat)+"<small> 원</small>","n")}`;
  $('#txnCount').textContent=`${rows.length}건`;
  const tb=$('#txnRows');
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="11"><div class="empty"><div class="big">💳</div>해당 월 거래내역이 없습니다.</div></td></tr>`; return; }
  tb.innerHTML=rows.map(r=>`<tr>
    <td>${esc(r.date)}</td>
    <td>${badgeFor(r.type,{"수입":"g","지출":"r"})}</td>
    <td>${esc(r.account)||'<span class="mini">-</span>'}</td>
    <td>${esc(r.desc)}</td>
    <td>${esc(r.vendor)||'<span class="mini">-</span>'}</td>
    <td class="mini">${esc(r.pay)||'-'}</td>
    <td>${r.evidence&&r.evidence!=="없음"?badgeFor(r.evidence,{"세금계산서":"b","계산서":"b","카드전표":"o","현금영수증":"g","간이영수증":"n","이체증":"n"}):'<span class="mini">-</span>'}</td>
    <td class="num">${won(r.supply)}</td>
    <td class="num">${won(r.vat)}</td>
    <td class="num"><b>${won(txnTotal(r))}</b></td>

function budgetSpent(name){ return Store.list("txns").filter(t=>t.type==="지출"&&(t.project||"")===name).reduce((s,t)=>s+txnTotal(t),0); }
function drawBudgets(){
  const rows=Store.list("budgets").slice();
  const totalB=rows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalS=rows.reduce((s,r)=>s+budgetSpent(r.project),0);

    ${card("총 예산",won(totalB)+"<small> 원</small>","b")}
    ${card("총 집행",won(totalS)+"<small> 원</small>","o")}
    ${card("잔여 예산",won(totalB-totalS)+"<small> 원</small>","g")}
    ${card("전체 집행률",(totalB?Math.round(totalS/totalB*100):0)+"<small> %</small>","n")}`;

  tb.innerHTML=rows.map(r=>{
    const spent=budgetSpent(r.project); const amt=Number(r.amount)||0;
    const pct=amt?Math.round(spent/amt*100):0;
    const col=pct>100?'var(--danger)':pct>85?'var(--warn)':'var(--brand)';
    return `<tr>
      <td><b>${esc(r.project)}</b></td><td>${esc(r.item)||'<span class="mini">-</span>'}</td>
      <td class="num">${won(amt)}</td><td class="num">${won(spent)}</td>
      <td class="num" style="color:${amt-spent<0?'var(--danger)':''}">${won(amt-spent)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="prog"><i style="width:${Math.min(100,pct)}%;background:${col}"></i></div><span class="mini" style="color:${col};font-weight:700">${pct}%</span></div></td>
      <td><div class="rowbtns">
        <button class="btn sm ghost" onclick="openBudget('${r.id}')">수정</button>
        <button class="btn sm ghost" onclick="(function(){if(confirm('삭제?')){Store.remove('budgets','${r.id}');drawBudgets();}})()">🗑</button>

/* ============================================================
   강사·자문비 지급 (원천징수: 기타소득 8.8% / 사업소득 3.3%)
   ============================================================ */
function withhold(gross,type){
  gross=Number(gross)||0;
  const rate=String(type||"").includes("3.3")?0.03:0.08;
  const income=Math.floor(gross*rate/10)*10;   // 소득세 10원미만 절사
  const local=Math.floor(income*0.1/10)*10;     // 지방소득세 10원미만 절사
  return {rate, income, local, deduct:income+local, net:gross-income-local};
}
function genDocNo(payDate,type){
  const d=String(payDate||todayStr()).replace(/-/g,'').slice(2); // YYMMDD
  const suffix=String(type||"").includes("3.3")?"나":"가";
  const base="bu"+d+suffix;
  const n=Store.list("payments").filter(p=>p.docno&&p.docno.indexOf(base+"-")===0).length+1;
  return base+"-"+n;
}
function renderPayments(){
  setHeader("강사·자문비 지급 (원천징수)","기타소득 8.8% · 사업소득 3.3% 자동계산, 지급대장·지출결의서",
    `<button class="btn no-print" onclick="exportCSV('payments')">CSV 내보내기</button>
     <button class="btn no-print" onclick="window.print()">🖨️ 지급대장 인쇄</button>
     <button class="btn primary no-print" onclick="openPayment()">+ 지급 입력</button>`);
  genState.payments=genState.payments||{month:todayStr().slice(0,7),type:"",q:""};
  $('#view').innerHTML=`
    <div class="cards" id="payCards"></div>
    <div class="panel"><div class="ph no-print">
      <div class="filters">
        <input type="month" id="payMonth" value="${genState.payments.month}">
        <select id="payType"><option value="">전체</option>${OPT.incomeType.map(o=>`<option>${o}</option>`).join('')}</select>
        <input type="search" id="payQ" placeholder="성명·프로젝트·적요 검색…">
      </div>
      <span class="mini" id="payCount"></span>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>문서번호</th><th>이체일</th><th>구분</th><th>프로젝트/학교</th><th>성명</th><th>적요</th>
      <th class="num">지급액</th><th class="num">소득세</th><th class="num">지방세</th><th class="num">실지급액</th><th class="no-print" style="width:150px"></th>
    </tr></thead><tbody id="payRows"></tbody></table></div></div>`;
  $('#payMonth').onchange=e=>{genState.payments.month=e.target.value; drawPayments();};
  $('#payType').value=genState.payments.type; $('#payType').onchange=e=>{genState.payments.type=e.target.value; drawPayments();};
  $('#payQ').oninput=e=>{genState.payments.q=e.target.value; drawPayments();};
  drawPayments();
}
function payFiltered(){
  let rows=Store.list("payments").slice().sort((a,b)=>(b.payDate||"").localeCompare(a.payDate||""));
  const st=genState.payments;
  if(st.month) rows=rows.filter(r=>(r.payDate||"").startsWith(st.month));
  if(st.type) rows=rows.filter(r=>r.incomeType===st.type);
  if(st.q){ const q=st.q.toLowerCase(); rows=rows.filter(r=>[r.name,r.project,r.desc].some(v=>String(v||"").toLowerCase().includes(q))); }
  return rows;
}
function drawPayments(){
  const rows=payFiltered();
  let g=0,d=0,net=0; rows.forEach(r=>{const w=withhold(r.gross,r.incomeType); g+=Number(r.gross)||0; d+=w.deduct; net+=w.net;});
  $('#payCards').innerHTML=`
    ${card("지급 인원",rows.length+"<small> 건</small>","b")}
    ${card("총 지급액",won(g)+"<small> 원</small>","n")}
    ${card("총 공제(원천세)",won(d)+"<small> 원</small>","o")}
    ${card("총 실지급액",won(net)+"<small> 원</small>","g")}`;
  $('#payCount').textContent=`${rows.length}건`;
  const tb=$('#payRows');
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="11"><div class="empty"><div class="big">💰</div>해당 월 지급 내역이 없습니다.</div></td></tr>`; return; }
  tb.innerHTML=rows.map(r=>{ const w=withhold(r.gross,r.incomeType); const et=!String(r.incomeType||'').includes('3.3');
    return `<tr>
      <td class="mini">${esc(r.docno)}</td><td>${esc(r.payDate)}</td>
      <td>${badgeFor(et?'기타 8.8%':'사업 3.3%',{"기타 8.8%":"b","사업 3.3%":"o"})}</td>
      <td>${esc(r.project)||'<span class="mini">-</span>'}</td><td><b>${esc(r.name)}</b></td><td class="mini">${esc(r.desc)}</td>
      <td class="num">${won(r.gross)}</td><td class="num">${won(w.income)}</td><td class="num">${won(w.local)}</td>
      <td class="num"><b>${won(w.net)}</b></td>
      <td class="no-print"><div class="rowbtns">
        <button class="btn sm ghost" onclick="showPayVoucher('${r.id}')">결의서</button>
        <button class="btn sm ghost" onclick="openPayment('${r.id}')">수정</button>
        <button class="btn sm ghost" onclick="delPayment('${r.id}')">🗑</button>
      </div></td></tr>`;}).join('');
}

function payDocRefresh(){

  if(f.docno.value && !/^bu\d{6}[가나]-\d+$/.test(f.docno.value)) return; // 사용자 임의 입력은 유지
  f.docno.value=genDocNo(f.payDate.value, f.incomeType.value);

function savePayment(id){

  ["incomeType","docno","evtDate","payDate","project","lecture","desc","name","phone","rrn","addr","bank","gross","memo"].forEach(k=>o[k]=fd.get(k));

   CSV / 백업
   ============================================================ */
function toCSV(rows,fields){
  const head=fields.join(',');
  const body=rows.map(r=>fields.map(f=>{
    let v=r[f]==null?"":String(r[f]); if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v;
  }).join(',')).join('\n');
  return "﻿"+head+"\n"+body; // BOM for Excel 한글
}
function download(name,content,type="text/csv;charset=utf-8"){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCSV(key){
  const rows=Store.list(key); if(!rows.length){ toast("내보낼 데이터가 없습니다"); return; }
  const fields=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>!k.startsWith('_'));
  download(`${key}_${todayStr()}.csv`, toCSV(rows,fields));
  toast("CSV로 내보냈습니다");
}
let _importTarget=null;
function importCSVPrompt(){ _importTarget="txns"; $('#fileInput').accept=".csv"; $('#fileInput').click(); }
function parseCSV(text){
  text=text.replace(/^﻿/,''); const rows=[]; let i=0,f="",row=[],q=false;
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"') q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c!=='\r') f+=c; }
    i++;
  }
  if(f.length||row.length){ row.push(f); rows.push(row); }
  return rows;
}
$('#fileInput').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      if(file.name.endsWith('.json')){ Backup.applyJSON(rd.result); }
      else { importTxnCSV(rd.result); }
    }catch(err){ alert("가져오기 실패: "+err.message); }
    e.target.value="";
  };
  rd.readAsText(file,'utf-8');
});
function importTxnCSV(text){
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()!==""));
  if(rows.length<2){ toast("데이터가 없습니다"); return; }
  const head=rows[0].map(h=>h.trim());
  // 헤더 매핑 (은행/카드 내역 유연 대응)
  const find=(...names)=>head.findIndex(h=>names.some(n=>h.replace(/\s/g,'').includes(n)));
  const ci={ date:find("일자","날짜","거래일","승인일"), desc:find("적요","내용","가맹점","적 요","비고","상호"),
             draw:find("출금","지출","사용금액","결제금액","출금액"), dep:find("입금","입금액","수입"),
             amt:find("금액"), account:find("계정","과목"), vendor:find("거래처") };
  let n=0;
  rows.slice(1).forEach(r=>{
    const cell=idx=>idx>=0?(r[idx]||"").trim():"";
    const num=s=>Number(String(s).replace(/[^0-9.-]/g,""))||0;
    const draw=num(cell(ci.draw)), dep=num(cell(ci.dep)), amt=num(cell(ci.amt));
    let type,total;
    if(dep>0){type="수입";total=dep;} else if(draw>0){type="지출";total=draw;}
    else if(amt!==0){ type=amt<0?"지출":"수입"; total=Math.abs(amt);} else return;
    const date=cell(ci.date).replace(/[.\/]/g,'-').slice(0,10) || todayStr();
    Store.upsert("txns",{ date, type, desc:cell(ci.desc)||"(가져온 내역)", vendor:cell(ci.vendor),
      account:cell(ci.account), pay:"법인통장", evidence:"없음", supply:total, vat:0 });
    n++;
  });
  toast(`${n}건을 가져왔습니다`); if(Router.current==="txns") drawTxns();
}
const Backup={
  export(){ download(`경리업무_백업_${todayStr()}.json`, JSON.stringify(Store.data,null,2), "application/json"); toast("전체 백업을 저장했습니다"); },
  importPrompt(){ _importTarget="json"; $('#fileInput').accept=".json"; $('#fileInput').click(); },
  applyJSON(text){ if(!confirm("현재 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?")) return;
    const obj=JSON.parse(text); Store.data=obj; Store.save(); toast("복원되었습니다"); Router.go(Router.current); }
};

/* ---------- 붙여넣기로 가져오기 (Claude가 만든 데이터를 한 번에 등록) ---------- */
const COLL_LABEL={todos:"할 일",vendors:"거래처",orders:"발주·견적",contacts:"연락처",docs:"문서·인증",contracts:"계약",employees:"직원",leaves:"휴가·근태",budgets:"사업예산",txns:"거래내역·전표",payments:"강사·자문비",costs:"원가 대장"};
function labelOf(k){ return COLL_LABEL[k]||k; }
function openPasteImport(){
  openModal("📋 붙여넣기로 가져오기",
    `<p class="mini">Claude가 만들어 준 데이터(JSON)를 아래 칸에 붙여넣고 <b>[가져오기]</b>를 누르세요.<br>손으로 입력하지 않아도 해당 항목이 자동으로 등록됩니다.</p>
     <textarea id="pasteBox" spellcheck="false" style="width:100%;min-height:240px;font-family:monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px" placeholder='{
  "orders": [
    {"date":"2026-08-14","kind":"견적","vendor":"○○교육청","item":"교재 개발 용역","amount":5000000}
  ],
  "contacts": [
    {"name":"홍길동","type":"강사","phone":"010-0000-0000"}
  ]
}'></textarea>
     <div id="pasteMsg" class="mini" style="margin-top:8px"></div>`,
    `<button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="runPasteImport()">가져오기</button>`, true);
  setTimeout(()=>{const b=$('#pasteBox'); if(b) b.focus();},100);
}
function runPasteImport(){
  const raw=($('#pasteBox').value||"").trim();
  if(!raw){ toast("붙여넣은 내용이 없습니다"); return; }
  let obj; try{ obj=JSON.parse(raw); }
  catch(e){ $('#pasteMsg').innerHTML=`<span style="color:var(--danger)">JSON 형식 오류: ${esc(e.message)}</span>`; return; }
  const known=["todos","vendors","orders","contacts","docs","contracts","employees","leaves","budgets","txns","payments","costs"];
  let total=0; const report=[];
  Object.keys(obj).forEach(k=>{
    if(!known.includes(k)){ report.push(`⚠️ '${esc(k)}' 는 알 수 없는 항목 — 건너뜀`); return; }
    const arr=Array.isArray(obj[k])?obj[k]:[obj[k]];
    let n=0; arr.forEach(item=>{ if(item&&typeof item==='object'){ const c={...item}; delete c.id; Store.upsert(k,c); n++; total++; } });
    report.push(`✅ ${labelOf(k)}: ${n}건 추가`);
  });
  if(!total){ $('#pasteMsg').innerHTML=`<span style="color:var(--danger)">가져올 항목이 없습니다. 형식을 확인하세요.</span>`; return; }
  $('#pasteMsg').innerHTML=report.join('<br>');
  toast(`총 ${total}건을 가져왔습니다`);
  setTimeout(()=>{ closeModal(); Router.go(Router.current); }, 1300);
}

/* ============================================================
   서버 동기화 (카페24 PHP+MySQL) — 온라인이면 서버에 저장/불러오기
   서버(api.php)가 없으면 자동으로 이 PC 저장(오프라인) 방식으로 동작
   ============================================================ */
const Sync={
  mode:"offline", _t:null,
  pw(){ return sessionStorage.getItem('app_pw')||''; },
  setStatus(s){
    const el=$('#syncStatus'); if(!el) return;
    const map={
      checking:["⚪ 확인 중…","rgba(255,255,255,.08)"],
      offline:["⚪ 이 PC에 저장","rgba(255,255,255,.08)"],
      online:["🟢 서버 저장됨","rgba(34,160,110,.35)"],
      saving:["🟡 저장 중…","rgba(210,170,40,.35)"],
      error:["🔴 저장 실패·클릭","rgba(200,70,60,.4)"]
    };
    const m=map[s]||map.offline; el.textContent=m[0]; el.style.background=m[1];
  },
  async start(){
    this.setStatus("checking");
    if(location.protocol==='file:'){ this.mode="offline"; this.setStatus("offline"); return; }
    let ping;
    try{ ping=await fetch('./api.php?action=ping',{cache:'no-store'}); }
    catch(e){ this.mode="offline"; this.setStatus("offline"); return; }
    if(!ping.ok){ this.mode="offline"; this.setStatus("offline"); return; }
    this.mode="online";
    if(this.pw() && await this.load()) return;
    this.showLogin();
  },
  showLogin(){
    openModal("서버 접속",
      `<div class="frm"><div class="fld full">
        <label>접속 비밀번호</label>
        <input type="password" id="loginPw" placeholder="config.php에 정한 비밀번호" onkeydown="if(event.key==='Enter')Sync.doLogin()">
        <div class="hint" style="margin-top:6px">여러 기기에서 같은 데이터로 접속합니다. 비밀번호는 관리자가 정한 값입니다.</div>
      </div></div>`,
      `<button class="btn" onclick="closeModal()">오프라인으로 사용</button>
       <button class="btn primary" onclick="Sync.doLogin()">접속</button>`);
    setTimeout(()=>{const i=$('#loginPw'); if(i) i.focus();},100);
  },
  async doLogin(){
    const i=$('#loginPw'); if(!i) return;
    sessionStorage.setItem('app_pw', i.value);
    if(await this.load()){ closeModal(); toast("서버에 접속했습니다"); }
    else { toast("접속 실패 — 비밀번호를 확인하세요"); }
  },
  async load(){
    try{
      const r=await fetch('./api.php?action=load',{headers:{'X-App-PW':this.pw()},cache:'no-store'});
      if(r.status===401){ sessionStorage.removeItem('app_pw'); return false; }
      if(!r.ok) throw 0;
      const j=await r.json();
      if(j.payload){ Store.data=JSON.parse(j.payload); Store.saveLocal(); }
      else { await this.push(true); }   // 서버가 비어있으면 현재 데이터로 초기화
      this.setStatus("online");
      if(Router.current) Router.go(Router.current);
      return true;
    }catch(e){ this.setStatus("error"); return false; }
  },
  pushSoon(){ if(this.mode!=="online") return; clearTimeout(this._t); this._t=setTimeout(()=>this.push(),1200); },
  async push(silent){
    if(this.mode!=="online") return;
    try{
      if(!silent) this.setStatus("saving");
      const r=await fetch('./api.php?action=save',{method:'POST',
        headers:{'X-App-PW':this.pw(),'Content-Type':'application/json'},
        body:JSON.stringify({payload:Store.data})});
      if(r.status===401){ this.setStatus("error"); this.showLogin(); return; }
      if(!r.ok) throw 0;
      this.setStatus("online");
    }catch(e){ this.setStatus("error"); }
  }
};

/* ============================================================
   시작
   ============================================================ */
function init(){
  Store.load();
  // 처음 실행(데이터 없음)이면 ㈜창체넷 실제 기초자료를 자동으로 채움
  if(!Store.data._seededFull){
    const empty = ["vendors","contracts","orders","costs","employees","budgets","txns","payments"].every(k=>Store.list(k).length===0);
    if(empty){ applySeed(); }
    Store.data._seededFull = true; Store.save();
  }
  buildNav();
  const start=location.hash.slice(1)||"dashboard";
  Router.go(start);          // 로컬 데이터로 즉시 표시
  Sync.start();              // 온라인이면 서버 접속·동기화 (백그라운드)
}
// const 로 선언한 객체를 인라인 onclick 등에서 쓸 수 있도록 전역 노출
window.Store=Store; window.Router=Router; window.Sync=Sync; window.Backup=Backup; window.OPT=OPT;
init();
</script>
